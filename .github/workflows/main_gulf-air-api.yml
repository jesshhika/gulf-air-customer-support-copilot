name: Build and deploy Node.js app to Azure Web App - gulf-air-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packages/api-langchain-js
        run: npm ci

      - name: Build application
        working-directory: packages/api-langchain-js
        run: npm run build --if-present

      - name: Remove development dependencies
        working-directory: packages/api-langchain-js
        run: npm prune --omit=dev

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: packages/api-langchain-js

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: node-app
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: gulf-air-api
          slot-name: Production
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E73AAB2603EE4FDFB31822F9976609E3 }}