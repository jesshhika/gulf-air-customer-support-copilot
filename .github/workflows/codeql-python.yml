name: "CodeQL Python"

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-servers/itinerary-planning/**/*.py'
      - 'packages/mcp-servers/model-inference/**/*.py'
      - '.github/workflows/codeql-python.yml'
      - '.github/codeql/python-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-servers/itinerary-planning/**/*.py'
      - 'packages/mcp-servers/model-inference/**/*.py'
      - '.github/workflows/codeql-python.yml'
      - '.github/codeql/python-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          for dir in packages/mcp-servers/itinerary-planning packages/mcp-servers/model-inference; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r $dir/requirements.txt
            fi
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          config-file: .github/codeql/python-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "python-analysis"
          upload: true